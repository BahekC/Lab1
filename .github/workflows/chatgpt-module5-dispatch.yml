name: Temporary Module 5 DOCX Dispatcher

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

env:
  PYTHONUTF8: '1'

jobs:
  generate:
    if: github.event.issue.title == '[chatgpt-module5-docx-20260724] generate'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout artifact branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt-docx-module5-20260724
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip python-docx

      - name: Generate and validate documents
        run: python chatgpt_module5/generate_module5.py

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: module5-practical-works
          path: chatgpt_module5/output/*.docx
          if-no-files-found: error
          retention-days: 3

      - name: Commit generated documents to artifact branch
        run: |
          git config user.name 'chatgpt-artifact-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chatgpt_module5/output
          git commit -m 'Generate module 5 practical-work DOCX files'
          git push origin HEAD:chatgpt-docx-module5-20260724

      - name: Close trigger issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --comment "Module 5 DOCX generation completed."
