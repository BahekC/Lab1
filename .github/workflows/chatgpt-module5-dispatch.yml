name: Temporary Module 5 DOCX Artifact

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

env:
  PYTHONUTF8: '1'

jobs:
  package:
    if: github.event.issue.title == '[chatgpt-module5-docx-20260724] artifact'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout artifact branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt-docx-module5-20260724

      - name: Validate expected files
        run: |
          test "$(find chatgpt_module5/download -maxdepth 1 -name 'module5_work_*.docx' | wc -l)" -eq 8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: module5-practical-works
          path: chatgpt_module5/download/module5_work_*.docx
          if-no-files-found: error
          retention-days: 3

      - name: Publish run identifier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "RUN_ID=${{ github.run_id }}"
          gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --comment "Artifact package created."
