name: Generate Module 5 DOCX

on:
  push:
    branches:
      - chatgpt-docx-module5-20260724
    paths:
      - 'chatgpt_module5/generate_module5.py'
      - '.github/workflows/generate-module5-docx.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'chatgpt_module5/generate_module5.py'
      - '.github/workflows/generate-module5-docx.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: '1'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt-docx-module5-20260724
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip python-docx

      - name: Generate and validate documents
        run: python chatgpt_module5/generate_module5.py

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: module5-practical-works
          path: chatgpt_module5/output/*.docx
          if-no-files-found: error
          retention-days: 3

      - name: Commit generated documents
        run: |
          git config user.name 'chatgpt-artifact-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chatgpt_module5/output
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'Generate module 5 practical-work DOCX files'
            git push origin HEAD:chatgpt-docx-module5-20260724
          fi
